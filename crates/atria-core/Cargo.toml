[package]
name = "atria-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust engine for the Atria AI desktop app: Messages API client, SSE streaming, agent loop and built-in tools"

[dependencies]
# v0.26.2: `socks` enables socks5:// proxy urls; `system-proxy` makes reqwest
# fall back to the OS proxy (WinINET on Windows) when no explicit proxy is
# set — behind Clash/V2Ray with system-proxy on, downloads work with zero config.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2", "blocking", "socks", "system-proxy"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
chrono = "0.4"
thiserror = "2"
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "process"] }

# v0.18.0: raw deflate decoding for embedded ZIP reading (docx/xlsx extraction)
flate2 = "1"
# v0.25.0: extract the llama.cpp runtime archive (zip OR tar.gz)
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"

[dev-dependencies]
# v0.25.0: net+sync for the in-test HTTP server that regression-tests
# resume/pause/stop of `hf::download_file`
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "process", "net", "sync"] }

# v0.18.0: raw deflate for embedded ZIP reading (docx/xlsx extraction)