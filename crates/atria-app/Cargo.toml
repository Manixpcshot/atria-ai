[package]
name = "atria-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Atria — AI desktop assistant for Windows, built with Rust (Tauri v2)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
atria-core = { path = "../atria-core" }

[[bin]]
name = "atria"
path = "src/main.rs"
