name: Windows Build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Validate frontend integration
        run: |
          node --check frontend/app.js
          node --check tests/ui_harness.mjs
          node tests/ui_harness.mjs

      - name: Build Atria (release)
        run: cargo build --release --locked -p atria-app

      - name: Run engine and app tests
        run: |
          cargo test --release --locked -p atria-core
          cargo test --release --locked -p atria-app

      - name: Package artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist-stage | Out-Null
          Copy-Item target/release/atria.exe dist-stage/Atria.exe
          Copy-Item README.md dist-stage/
          Copy-Item LICENSE dist-stage/
          Compress-Archive -Path dist-stage/* -DestinationPath Atria-Dawn-win64.zip

      - name: Sign update manifest and create SHA-256 sums
        if: github.event_name == 'release'
        shell: pwsh
        env:
          ATRIA_UPDATE_PRIVATE_KEY: ${{ secrets.ATRIA_UPDATE_PRIVATE_KEY }}
          ATRIA_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/sign-release.mjs

      - name: Upload signed assets to the GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/atria.exe
            Atria-Dawn-win64.zip
            SHA256SUMS.txt
            update-manifest.json
            update-manifest.sig
          tag_name: ${{ github.event.release.tag_name }}
