name: Release (Windows + macOS)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Syntax-check frontend
        run: node --check frontend/app.js
      - name: Syntax-check UI harness
        run: node --check tests/ui_harness.mjs
      - name: Run UI harness
        run: node tests/ui_harness.mjs

      - name: Build Atria (release)
        run: cargo build --release --locked -p atria-app

      - name: Build atria-cli (release)
        run: cargo build --release --locked -p atria-cli

      - name: Test atria-core
        run: cargo test --release --locked -p atria-core
      - name: Test atria-app
        run: cargo test --release --locked -p atria-app

      - name: Package artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist-stage | Out-Null
          Copy-Item target/release/atria.exe dist-stage/Atria.exe
          Copy-Item README.md dist-stage/
          Copy-Item LICENSE dist-stage/
          Compress-Archive -Path dist-stage/* -DestinationPath Atria-Dawn-win64.zip

      - name: Sign update manifest and create SHA-256 sums
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v'))
        shell: pwsh
        env:
          ATRIA_UPDATE_PRIVATE_KEY: ${{ secrets.ATRIA_UPDATE_PRIVATE_KEY }}
          ATRIA_RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: node scripts/sign-release.mjs

      - name: Stage signed release assets
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v'))
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets | Out-Null
          Copy-Item target/release/atria.exe release-assets/atria.exe
          Copy-Item target/release/atria-cli.exe release-assets/atria-cli.exe
          Copy-Item Atria-Dawn-win64.zip release-assets/
          Copy-Item SHA256SUMS.txt release-assets/
          Copy-Item update-manifest.json release-assets/
          Copy-Item update-manifest.sig release-assets/

      - name: Upload signed assets to the draft or published release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v'))
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/atria.exe
            release-assets/atria-cli.exe
            release-assets/Atria-Dawn-win64.zip
            release-assets/SHA256SUMS.txt
            release-assets/update-manifest.json
            release-assets/update-manifest.sig
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          body_path: docs/releases/${{ github.event.release.tag_name || github.ref_name }}.md
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          overwrite_files: true
          fail_on_unmatched_files: true

  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust (stable + Apple targets)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install Tauri CLI v2
        run: npm install -g @tauri-apps/cli@^2

      - name: Build atria-cli (macOS)
        run: cargo build --release --locked -p atria-cli

      - name: Build Atria (universal .dmg)
        run: |
          export PATH="$(npm prefix -g)/bin:$PATH"
          tauri build --bundles dmg --target universal-apple-darwin
        working-directory: crates/atria-app

      - name: Stage dmg
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v'))
        run: |
          mkdir -p release-assets
          D=$(find target -type d -path '*/release/bundle/dmg' | head -1)
          echo "dmg dir: $D"
          cp "$D"/*.dmg release-assets/Atria-Dawn-macos.dmg
          cp target/release/atria-cli release-assets/atria-cli
          ls -la release-assets

      - name: Upload macOS assets to the release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v'))
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/Atria-Dawn-macos.dmg
            release-assets/atria-cli
          tag_name: ${{ github.event_release.tag_name || github.ref_name }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          overwrite_files: true
          fail_on_unmatched_files: false
